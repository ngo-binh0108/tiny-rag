[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-rag"
version = "0.1.0"
description = "A minimal, dependency-free retrieval-augmented generation (RAG) CLI powered by BM25 and Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ngo-binh0108" }]
keywords = ["rag", "llm", "ai", "bm25", "claude", "retrieval"]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest"]

[project.scripts]
tiny-rag = "tiny_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
